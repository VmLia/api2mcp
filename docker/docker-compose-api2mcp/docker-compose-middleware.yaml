# 基础环境独立容器 docker-compose 配置，版本 >=3.8
# 启动：docker-compose -f docker-compose-middleware.yaml up -d
# 停止并保留数据：docker-compose -f docker-compose-middleware.yaml down
# 停止并清空数据：docker-compose -f docker-compose-middleware.yaml down --volumes
# 网络：外部预创建桥接 bridge_192_100，固定静态IP，不暴露宿主机端口，直接容器IP访问
# 说明：不依赖外部.env文件，所有变量默认值内置在当前配置中

version: '3.8'

networks:
  bridge_192_100:
    external: true
    name: bridge_192_100

services:
  postgres:
    image: postgres:15-alpine
    container_name: api2mcp-postgres
    labels:
      env: dev
      module: api2mcp
      type: database
    networks:
      bridge_192_100:
        ipv4_address: 192.100.35.10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    environment:
      POSTGRES_DB: api2mcp
      POSTGRES_USER: api2mcp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-api2mcp@2026}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    user: "999:999"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api2mcp -d api2mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: api2mcp-redis
    labels:
      env: dev
      module: api2mcp
      type: cache
    networks:
      bridge_192_100:
        ipv4_address: 192.100.35.12
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-api2mcpRedis@2026}
      --appendonly yes
      --save 60 1000
      --rename-command FLUSHDB ""
      --rename-command FLUSHALL ""
      --rename-command KEYS ""
    volumes:
      - ./redisdata:/data
    user: "999:999"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-api2mcpRedis@2026}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
